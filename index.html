<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Delta - 2D Authoritative Extraction Shooter</title>
  <meta name="description" content="Hardcore 2D extraction shooter built with HTML5 Canvas and Unicode Emojis.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Premium HUD Overlay (Glassmorphism) -->
  <div id="hud">
    <!-- Top Bar: Game Mode & Extraction Status -->
    <div class="top-bar">
      <div class="mission-info glass-panel">
        <span class="pulse-dot"></span>
        <div class="info-text">
          <div class="mission-title">ZONE: DELTA-01</div>
          <div class="mission-status">RAID IN PROGRESS</div>
        </div>
      </div>
      
      <!-- Extraction Timer Overlay (Hidden by default) -->
      <div id="extraction-banner" class="glass-panel hidden">
        <div class="extract-icon">🚁</div>
        <div class="extract-content">
          <div class="extract-title">EXTRACTION INITIATED</div>
          <div class="extract-bar-container">
            <div id="extract-progress-bar" class="extract-bar"></div>
          </div>
          <div id="extract-time-text" class="extract-time">10.0s</div>
        </div>
      </div>
    </div>

    <!-- Crosshair / Spread indicator overlay element is rendered on canvas -->

    <!-- Center Interaction Prompt -->
    <div id="interaction-prompt" class="glass-panel hidden">
      <span class="key-badge">F</span>
      <span id="interaction-text">拾取 战利品箱</span>
    </div>

    <!-- Bottom Left: Player Stats (Health, Armor, Stamina) -->
    <div class="stats-container glass-panel">
      <div class="stat-header">
        <span id="player-avatar" class="avatar-icon">🕵️</span>
        <div class="player-details">
          <div class="player-name">OPERATOR 07</div>
          <div class="armor-class">CLASS 4 ARMOR</div>
        </div>
      </div>

      <div class="stat-bars">
        <!-- Health Bar -->
        <div class="bar-group">
          <div class="bar-label">
            <span>HP</span>
            <span id="hp-text">100/100</span>
          </div>
          <div class="bar-track">
            <div id="hp-fill" class="bar-fill hp-fill" style="width: 100%;"></div>
          </div>
        </div>

        <!-- Armor Bar -->
        <div class="bar-group">
          <div class="bar-label">
            <span>ARMOR</span>
            <span id="armor-text">80/80</span>
          </div>
          <div class="bar-track">
            <div id="armor-fill" class="bar-fill armor-fill" style="width: 100%;"></div>
          </div>
        </div>

        <!-- Stamina Bar -->
        <div class="bar-group">
          <div class="bar-label">
            <span>STAMINA</span>
            <span id="stamina-text">100%</span>
          </div>
          <div class="bar-track">
            <div id="stamina-fill" class="bar-fill stamina-fill" style="width: 100%;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Right: Weapon & Ammo & Inventory QuickView -->
    <div class="weapon-container glass-panel">
      <div class="weapon-info">
        <div class="weapon-icon">🔫</div>
        <div class="weapon-specs">
          <div class="weapon-name">TAC-SMG (9x19mm)</div>
          <div class="fire-mode">AUTO</div>
        </div>
      </div>
      <div class="ammo-display">
        <span id="ammo-current" class="ammo-big">30</span>
        <span class="ammo-slash">/</span>
        <span id="ammo-max" class="ammo-small">120</span>
      </div>
      <div id="reloading-msg" class="reloading-text hidden">RELOADING...</div>
    </div>

    <!-- Inventory / Backpack Modal (Toggled with Tab or F) -->
    <div id="inventory-drawer" class="glass-panel">
      <div class="inv-header">
        <span>🎒 战利品背包 (Loot Sack)</span>
        <span id="loot-count">0 / 12</span>
      </div>
      <div id="loot-grid" class="inv-grid">
        <!-- Loot item slots dynamically added here -->
      </div>
    </div>

    <!-- Notification / Kill feed -->
    <div id="notification-feed"></div>
  </div>

  <!-- Game Over / Victory Modal -->
  <div id="result-modal" class="modal-container hidden">
    <div class="modal-box glass-panel">
      <div id="result-icon" class="result-icon">🏆</div>
      <h1 id="result-title">RAID SUCCESSFUL</h1>
      <p id="result-desc">You successfully extracted from Delta-01 with your valuable loot.</p>
      <div class="summary-loot" id="summary-loot-container"></div>
      <button id="restart-btn" class="glow-btn">REDEPLOY</button>
    </div>
  </div>

  <!-- Audio elements or web audio API generated sounds -->
  <script type="module" src="game.js"></script>
</body>
</html>
